version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ast_rag_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
